# Весь стек одним файлом:
#   docker compose up -d --build
# Miniapp: http://localhost:8081 · API: http://localhost:8081/api (или напрямую :4002)
# Только база (для npm run start:dev):
#   docker compose up -d wishlistdb
# Порты публикуются на 127.0.0.1 — наружу смотрит только reverse proxy (Caddy).
services:
  wishlistdb:
    image: postgres:16-alpine
    container_name: wishlistdb
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: erkelik-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      UPLOADS_DIR: /app/uploads
    volumes:
      # фото желаний — переживают пересборку контейнера; включить в бэкап
      - uploads:/app/uploads
    depends_on:
      wishlistdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:4002:4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: erkelik-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"

volumes:
  db-data:
  uploads:
